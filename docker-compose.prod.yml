# 운영(OCI VM): docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  db:
    ports: []                      # 외부 노출 안 함
    restart: unless-stopped
  api:
    restart: unless-stopped
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "true"
  web:
    restart: unless-stopped
    build:
      args:
        API_INTERNAL_URL: http://api:4000
  nginx:
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # 최초 발급: docker compose -f ... run --rm certbot certonly --webroot -w /var/www/certbot -d DOMAIN --email you@example.com --agree-tos
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

volumes:
  certbot-etc:
  certbot-www:
