# 운영용 (Oracle Cloud 공유 서버의 호스트 nginx 에 추가하는 server 블록).
# 다른 사이트의 server 블록은 건드리지 않는다. 443 블록·HTTP→HTTPS 리다이렉트는 certbot --nginx 가 추가한다.
#   sudo cp nginx/prod.conf /etc/nginx/sites-available/routinebox.jaehwan.kr
#   sudo ln -s /etc/nginx/sites-available/routinebox.jaehwan.kr /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d routinebox.jaehwan.kr
server {
    listen 80;
    listen [::]:80;
    server_name routinebox.jaehwan.kr;
    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://127.0.0.1:4300/;   # /api 프리픽스 제거
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        # Next.js SSR 응답은 Link 프리로드 헤더(폰트·청크)가 6KB 를 넘는다 → 기본 4KB 버퍼면 502 "upstream sent too big header"
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
