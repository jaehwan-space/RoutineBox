name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: routinebox
          POSTGRES_PASSWORD: routinebox
          POSTGRES_DB: routinebox_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U routinebox -d routinebox_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://routinebox:routinebox@localhost:5433/routinebox_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Lint (web)
        run: pnpm --filter @routinebox/web lint
      - name: Prisma migrate (test DB)
        run: pnpm --filter @routinebox/api exec prisma migrate deploy
      - name: Test
        run: pnpm -r test
      - name: Build (web)
        run: pnpm --filter @routinebox/web build
